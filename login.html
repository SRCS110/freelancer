<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Freelancer — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>

<!-- Supabase JS v2 — must load synchronously before auth.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="client/js/auth.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
:root {
  --bg:        #0a0a0c;
  --bg-raised: #121216;
  --bg-input:  #0a0a0c;
  --border:    #24242d;
  --text:      #e2e8f0;
  --text-muted:#808b9e;
  --accent:    #3bf4a3;
  --accent-fg: #0a0a0c;
  --danger:    #ff4757;
}
body.light {
  --bg:        #f4f4f5;
  --bg-raised: #ffffff;
  --bg-input:  #f9f9fb;
  --border:    #e2e2e8;
  --text:      #18181b;
  --text-muted:#71717a;
  --accent:    #059669;
  --accent-fg: #ffffff;
  --danger:    #dc2626;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 16px;
  transition: background .2s, color .2s;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(color-mix(in srgb, var(--accent) 6%, transparent) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}
.login-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: clamp(24px, 5vw, 40px);
  width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  position: relative; z-index: 1;
}
.logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
.logo-mark {
  width: 48px; height: 48px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px; font-weight: 700; color: var(--accent-fg);
}
.login-card h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.3rem; font-weight: 700;
  margin: 0 0 6px; text-align: center;
  color: var(--text); letter-spacing: .5px; text-transform: uppercase;
}
.login-card .sub { color: var(--text-muted); font-size: 0.82rem; text-align: center; margin: 0 0 24px; font-family: 'JetBrains Mono', monospace; }
.mode-tabs { display: flex; border: 1px solid var(--border); border-radius: 4px; padding: 3px; gap: 3px; margin-bottom: 20px; background: var(--bg); }
.mode-tab {
  flex: 1; padding: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; font-weight: 600;
  border: none; background: transparent; border-radius: 3px;
  cursor: pointer; color: var(--text-muted); transition: all .15s;
}
.mode-tab.active { background: var(--bg-raised); color: var(--text); }
.field { margin-bottom: 14px; }
.field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; background: var(--bg-input); color: var(--text); transition: border-color .15s; outline: none; }
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text-muted); opacity: .5; }
.btn { width: 100%; padding: 11px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; border: none; border-radius: 3px; cursor: pointer; transition: opacity .15s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 10px; letter-spacing: .3px; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-google  { background: var(--bg-raised); color: var(--text); border: 1px solid var(--border); }
.btn-google:hover { opacity: .85; }
.divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
.msg { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; margin-top: 12px; text-align: center; padding: 8px 12px; border-radius: 3px; display: none; }
.msg.error   { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); display: block; }
.msg.success { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); display: block; }
.msg.info    { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 8%, transparent); border: 1px solid var(--border); display: block; }
.auth-footer { margin-top: 14px; text-align: center; }
.auth-footer button { background: none; border: none; padding: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--accent); cursor: pointer; font-weight: 600; }
.auth-footer button:hover { text-decoration: underline; }
.btn .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--accent-fg); border-radius: 50%; animation: spin .7s linear infinite; display: none; }
.btn-google .spinner { border-color: color-mix(in srgb, var(--text) 15%, transparent); border-top-color: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }
.btn.loading .spinner { display: block; }
.btn.loading .btn-label { display: none; }
#resetPanel { display: none; }
.brand-foot { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-muted); opacity: .4; pointer-events: none; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-wrap">
    <div class="logo-mark">F</div>
  </div>
  <h1>Freelancer</h1>
  <p class="sub">Your all-in-one business command center</p>

  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="signin">Sign in</button>
    <button class="mode-tab" data-mode="signup">Create account</button>
  </div>

  <div id="emailPanel">
    <div class="field">
      <label for="emailInput">Email address</label>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field" id="nameFieldWrap" style="display:none">
      <label for="nameInput">Full name</label>
      <input type="text" id="nameInput" placeholder="Jane Smith" autocomplete="name"/>
    </div>
    <div class="field">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" id="emailBtn">
      <span class="btn-label">Sign in</span>
      <span class="spinner"></span>
    </button>
    <div class="auth-footer" id="signInFooter">
      <button id="forgotBtn">Forgot password?</button>
    </div>
  </div>

  <div class="divider"><span>or</span></div>

  <button class="btn btn-google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 12.075 17.64 9.767 17.64 9.2Z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
    </svg>
    <span class="btn-label">Continue with Google</span>
    <span class="spinner"></span>
  </button>

  <div id="resetPanel">
    <div class="field">
      <label for="resetEmail">Email address</label>
      <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <button class="btn btn-primary" id="resetBtn">
      <span class="btn-label">Send reset link</span>
      <span class="spinner"></span>
    </button>
    <div class="auth-footer" style="margin-top:14px">
      <button id="backToSignin">← Back to sign in</button>
    </div>
  </div>

  <div class="msg" id="authMsg"></div>

  <div style="text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <a href="index.html?demo=true"
      style="font-family:'JetBrains Mono',monospace;font-size:11px;
             color:var(--text-muted);text-decoration:none;letter-spacing:.3px">
      explore the demo →
    </a>
  </div>
</div>

<div class="brand-foot">freelance.srcs.online</div>

<script>
// Apply saved theme
if (localStorage.getItem("fh_theme") === "light") {
  document.body.classList.add("light");
}

function waitForAuth(cb, tries = 0) {
  if (window.Auth) { cb(); return; }
  if (tries < 100) setTimeout(() => waitForAuth(cb, tries + 1), 50);
  else console.error('[login] auth.js never loaded');
}

// Auto-switch to signup mode if coming from upgrade modal or invite
const _lp = new URLSearchParams(location.search);
if (_lp.get('signup') === 'true' || _lp.get('invite') === 'pending') {
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const signupTab = document.querySelector('[data-mode="signup"]');
      if (signupTab) signupTab.click();
      // Show invite message
      if (_lp.get('invite') === 'pending') {
        const msg = document.getElementById('authMsg');
        if (msg) {
          msg.textContent = "You've been invited to a team. Sign in or create an account to join.";
          msg.className = 'msg info';
        }
      }
    }, 100);
  });
}

waitForAuth(function() {

  /* ── If already signed in, skip to dashboard ── */
  (async () => {
    try {
      const session = await Auth.getSession();
      if (session) { location.href = 'index.html'; }
    } catch(e) {}
  })();

  /* ── Password reset redirect ── */
  if (new URLSearchParams(location.search).get('mode') === 'reset') showResetConfirmMode();

  /* ── Mode tabs ── */
  let currentMode = 'signin';
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentMode = tab.dataset.mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t === tab));
      document.getElementById('nameFieldWrap').style.display   = currentMode === 'signup' ? 'block' : 'none';
      document.getElementById('signInFooter').style.display    = currentMode === 'signin' ? 'block' : 'none';
      document.getElementById('emailBtn').querySelector('.btn-label').textContent = currentMode === 'signup' ? 'Create account' : 'Sign in';
      document.getElementById('passwordInput').autocomplete    = currentMode === 'signup' ? 'new-password' : 'current-password';
      clearMsg();
    });
  });

  /* ── Email / password submit ── */
  document.getElementById('emailBtn').addEventListener('click', handleEmailAuth);
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleEmailAuth(); });

  async function handleEmailAuth() {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const name     = document.getElementById('nameInput').value.trim();
    if (!email)    return showMsg('Please enter your email address.', 'error');
    if (!password) return showMsg('Please enter your password.', 'error');
    if (currentMode === 'signup' && password.length < 8)
      return showMsg('Password must be at least 8 characters.', 'error');
    setLoading('emailBtn', true); clearMsg();
    try {
      if (currentMode === 'signin') {
        await Auth.signInWithEmail(email, password);
        location.href = 'index.html';
      } else {
        const { user } = await Auth.signUpWithEmail(email, password, { full_name: name });
        if (user && !user.identities?.length) {
          // Account exists — if they came via invite, switch to sign in automatically
          const isInviteFlow = new URLSearchParams(location.search).get('invite') === 'pending'
            || localStorage.getItem('fh_pending_invite');
          if (isInviteFlow) {
            showMsg('Account already exists — signing you in to complete team join…', 'info');
            setTimeout(() => {
              document.querySelector('[data-mode="signin"]').click();
              document.getElementById('emailInput').value = email;
            }, 1000);
          } else {
            showMsg('An account with this email already exists. Sign in instead.', 'error');
          }
        } else {
          showMsg('Account created! Check your email to confirm, then sign in.', 'success');
          document.querySelector('[data-mode="signin"]').click();
        }
      }
    } catch(err) {
      showMsg(friendlyError(err.message), 'error');
    } finally {
      setLoading('emailBtn', false);
    }
  }

  /* ── Google OAuth — NOT async (popup blocker fix) ── */
  document.getElementById('googleBtn').addEventListener('click', () => {
    setLoading('googleBtn', true); clearMsg();
    Auth.signInWithGoogle().catch(err => {
      showMsg(friendlyError(err.message), 'error');
      setLoading('googleBtn', false);
    });
  });

  /* ── Forgot password ── */
  document.getElementById('forgotBtn').addEventListener('click', () => {
    document.getElementById('modeTabs').style.display   = 'none';
    document.getElementById('emailPanel').style.display = 'none';
    document.querySelector('.divider').style.display    = 'none';
    document.getElementById('googleBtn').style.display  = 'none';
    document.getElementById('resetPanel').style.display = 'block';
    clearMsg();
  });
  document.getElementById('backToSignin').addEventListener('click', () => {
    document.getElementById('modeTabs').style.display   = 'flex';
    document.getElementById('emailPanel').style.display = 'block';
    document.querySelector('.divider').style.display    = 'flex';
    document.getElementById('googleBtn').style.display  = 'flex';
    document.getElementById('resetPanel').style.display = 'none';
    clearMsg();
  });
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) return showMsg('Please enter your email address.', 'error');
    setLoading('resetBtn', true); clearMsg();
    try {
      await Auth.sendPasswordReset(email);
      showMsg('Reset link sent — check your inbox (and spam folder).', 'success');
    } catch(err) {
      showMsg(friendlyError(err.message), 'error');
    } finally {
      setLoading('resetBtn', false);
    }
  });

  /* ── Password update after reset link ── */
  function showResetConfirmMode() {
    document.getElementById('modeTabs').style.display   = 'none';
    document.querySelector('.sub').textContent          = 'Choose a new password';
    document.getElementById('emailPanel').style.display = 'none';
    document.querySelector('.divider').style.display    = 'none';
    document.getElementById('googleBtn').style.display  = 'none';
    const panel = document.getElementById('resetPanel');
    panel.innerHTML = `
      <div class="field">
        <label for="newPw">New password</label>
        <input type="password" id="newPw" placeholder="Min. 8 characters" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary" id="updatePwBtn">
        <span class="btn-label">Update password</span>
        <span class="spinner"></span>
      </button>`;
    panel.style.display = 'block';
    document.getElementById('updatePwBtn').addEventListener('click', async () => {
      const pw = document.getElementById('newPw').value;
      if (pw.length < 8) return showMsg('Password must be at least 8 characters.', 'error');
      setLoading('updatePwBtn', true);
      try {
        await Auth.updatePassword(pw);
        showMsg('Password updated — redirecting…', 'success');
        setTimeout(() => location.href = 'index.html', 1800);
      } catch(err) {
        showMsg(friendlyError(err.message), 'error');
        setLoading('updatePwBtn', false);
      }
    });
  }

  /* ── Helpers ── */
  function showMsg(text, type = 'info') {
    const el = document.getElementById('authMsg');
    el.textContent = text; el.className = `msg ${type}`;
  }
  function clearMsg() {
    const el = document.getElementById('authMsg');
    el.className = 'msg'; el.textContent = '';
  }
  function setLoading(btnId, loading) {
    document.getElementById(btnId)?.classList.toggle('loading', loading);
  }
  function friendlyError(msg = '') {
    if (/invalid.*(login|credentials)/i.test(msg)) return 'Incorrect email or password.';
    if (/email.*not.*confirmed/i.test(msg))         return 'Please confirm your email before signing in.';
    if (/already.*registered/i.test(msg))           return 'An account with this email already exists — sign in instead to join the team.';
    if (/password.*short/i.test(msg))               return 'Password must be at least 8 characters.';
    if (/rate.?limit/i.test(msg))                   return 'Too many attempts — please wait a moment.';
    if (/network/i.test(msg))                       return 'Network error — check your connection.';
    return msg || 'Something went wrong. Please try again.';
  }

}); // end waitForAuth
</script>
</body>
</html>
